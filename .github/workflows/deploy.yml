name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Worker (spam-scorer-ai)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-pages:
    name: Pages (outlook-spam-scorer.pages.dev)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect add-in assets
        run: |
          mkdir -p dist
          cp taskpane.html taskpane.js taskpane.css dist/
          cp icon-*.png dist/
          cp _worker.js dist/
          cp -r Samples dist/
          cp -r Delivery-Reports dist/
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy dist --project-name=outlook-spam-scorer
