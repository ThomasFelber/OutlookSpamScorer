<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <title>Spam-Bewerter</title>
  <link rel="stylesheet" href="taskpane.css?v=2.2.7">
  <!-- Office.js muss synchron geladen werden (kein defer) -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="jszip.min.js" defer></script>
  <script src="taskpane.js?v=2.2.7" defer></script>
</head>
<body>

  <!-- Toast-Benachrichtigung -->
  <div id="toast" class="toast" aria-live="polite" role="status"></div>

  <!-- Pin-Hinweis (verschwindet nach erstem Pinnen / nach Dismiss) -->
  <div id="pin-hint" class="pin-hint">
    📌 Pane oben anpinnen → bleibt bei jedem E-Mail-Wechsel offen
    <button id="pin-hint-dismiss" class="pin-hint-dismiss" aria-label="Hinweis schließen">✕</button>
  </div>

  <!-- Ladezustand -->
  <div id="state-loading" class="state-panel">
    <div class="spinner" aria-hidden="true"></div>
    <span>Analysiere E-Mail…</span>
  </div>

  <!-- Kein Element geöffnet -->
  <div id="state-no-item" class="state-panel hidden">
    <p class="hint">Bitte eine E-Mail öffnen.</p>
  </div>

  <!-- Fehler -->
  <div id="state-error" class="state-panel hidden">
    <p class="error-text" id="error-message"></p>
    <button id="btn-retry" class="btn btn-secondary">Erneut versuchen</button>
  </div>

  <!-- Ergebnis -->
  <div id="state-result" class="hidden">

    <!-- Score-Anzeige (Score 1: Spam | Score 2: Optimierungspotenzial) -->
    <div id="scores-area" class="scores-area">

      <div id="score-wrap" class="score-wrap">
        <div class="score-label">Spam</div>
        <div id="score-number" class="score-number">0</div>
        <div class="score-sublabel">von 10</div>
        <div class="score-bar-track" role="meter" aria-label="Spam-Score" aria-valuemin="0" aria-valuemax="10">
          <div id="score-bar-fill" class="score-bar-fill" style="width:0%"></div>
        </div>
        <div id="score-verdict" class="score-verdict"></div>
      </div>

      <!-- Score 2: only visible for authorized account (toggled by applyAccountVisibility) -->
      <div id="opp-wrap" class="opp-wrap hidden">
        <div class="score-label">Potenzial</div>
        <div id="opp-number" class="score-number">0</div>
        <div class="score-sublabel">von 10</div>
        <div class="score-bar-track" role="meter" aria-label="Optimierungs-Potenzial" aria-valuemin="0" aria-valuemax="10">
          <div id="opp-bar-fill" class="score-bar-fill" style="width:0%"></div>
        </div>
        <div id="opp-verdict" class="score-verdict"></div>
      </div>

    </div>

    <!-- Header-Details Expander (Auth + MS-Spamfilter) -->
    <div id="detail-expander" class="detail-expander">
      <button id="btn-detail" class="btn-detail" aria-expanded="false" aria-controls="detail-panel">
        <span class="det-chevron">›</span>
        <span id="det-peek" class="det-peek"></span>
      </button>
      <div id="detail-panel" class="detail-panel hidden">
        <div id="det-auth" class="det-group"></div>
        <div id="det-ms"   class="det-group"></div>
      </div>
    </div>

    <!-- Spam-Indikatoren -->
    <section class="section">
      <h2>Spam-Indikatoren</h2>
      <ul id="reasons-list" class="reasons-list"></ul>
    </section>

    <!-- Potenzial-Indikatoren (nur für autorisierte Accounts) -->
    <section class="section hidden" id="opp-reasons-section">
      <h2>Potenzial-Indikatoren</h2>
      <ul id="opp-reasons-list" class="reasons-list"></ul>
    </section>

    <!-- Versteckter Text (nur sichtbar wenn gefunden) -->
    <section class="section hidden" id="hidden-text-section">
      <h2>Versteckter Text</h2>
      <button id="btn-toggle-hidden" class="btn-expander" aria-expanded="false">
        <span class="expander-icon">▶</span> Anzeigen
      </button>
      <div id="hidden-text-content" class="hidden-text-content hidden" aria-live="polite"></div>
    </section>

    <!-- AI Analyse (button hides after use) -->
    <section class="section">
      <h2>AI Analyse</h2>
      <button id="btn-claude" class="btn btn-claude">Mit AI prüfen</button>
      <div id="claude-result" class="claude-result hidden" aria-live="polite"></div>
    </section>

    <!-- Verbesserungsvorschläge (inline, nach Klick sichtbar) -->
    <div id="advice-result" class="advice-result hidden" aria-live="polite"></div>

    <!-- LLM-Prompt (unterhalb der Empfehlungen, nach AI-Check sichtbar) -->
    <div id="llm-prompt-container" class="hidden"></div>

    <!-- Dokumente generieren -->
    <section class="section" id="artifacts-section">
      <h2>Dokumente generieren</h2>
      <div class="artifact-row">
        <button id="btn-delivery-report" class="btn btn-artifact">📄 Report</button>
        <button id="btn-advice"          class="btn btn-artifact">💡 Empfehlungen</button>
        <button id="btn-action-plan"     class="btn btn-artifact">📋 Aktionsplan</button>
        <button id="btn-anschreiben"     class="btn btn-artifact">✉ Anschreiben</button>
      </div>
      <div class="artifact-row artifact-row-compliance">
        <button id="btn-compliance-b2b" class="btn btn-artifact btn-compliance">⚖ Compliance B2B</button>
        <button id="btn-compliance-b2c" class="btn btn-artifact btn-compliance">⚖ Compliance B2C</button>
      </div>
    </section>

    <!-- Export (non-authorized accounts only) -->
    <section class="section hidden" id="export-section">
      <h2>Export</h2>
      <button id="btn-zip" class="btn btn-secondary">📦 Assessment exportieren</button>
    </section>

    <!-- Kopieren -->
    <section class="section">
      <h2>Rohdaten kopieren</h2>
      <div class="copy-row">
        <button id="btn-copy-headers" class="btn btn-copy">Header</button>
        <button id="btn-copy-body"    class="btn btn-copy">Body-Text</button>
      </div>
    </section>

  </div>

  <!-- Versionsnummer -->
  <div id="version-label" class="version-label"></div>

</body>
</html>
