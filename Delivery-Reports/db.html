<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery Reports – Datenbank</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    header { max-width: 860px; margin: 0 auto 40px; }
    header a { font-size: 13px; color: #64748b; text-decoration: none; }
    header a:hover { color: #94a3b8; }
    header h1 { font-size: 26px; font-weight: 700; color: #f8fafc; margin-top: 14px; }
    header p  { margin-top: 6px; font-size: 14px; color: #64748b; }

    .toolbar {
      max-width: 860px; margin: 0 auto 24px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .toolbar input {
      flex: 1; min-width: 200px;
      background: #1a1f2e; border: 1px solid #1e293b; border-radius: 8px;
      color: #e2e8f0; font-size: 13px; padding: 8px 14px;
      outline: none;
    }
    .toolbar input:focus { border-color: #334155; }
    .toolbar select {
      background: #1a1f2e; border: 1px solid #1e293b; border-radius: 8px;
      color: #94a3b8; font-size: 13px; padding: 8px 12px;
      outline: none; cursor: pointer;
    }
    .count { font-size: 12px; color: #475569; margin-left: auto; white-space: nowrap; }

    .report-grid { max-width: 860px; margin: 0 auto; display: grid; gap: 10px; }

    .report-card {
      display: flex; align-items: flex-start; gap: 16px;
      background: #1a1f2e; border: 1px solid #1e293b;
      border-radius: 10px; padding: 14px 18px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
    }
    .report-card:hover { border-color: #334155; background: #1e2438; }

    .card-left { flex: 1; min-width: 0; }
    .card-title { font-size: 14px; font-weight: 600; color: #f1f5f9; margin-bottom: 3px; }
    .card-meta  { font-size: 11px; color: #475569; margin-bottom: 8px; }

    .pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .pill {
      font-size: 11px; font-weight: 500;
      padding: 2px 8px; border-radius: 99px;
    }
    .pill-gray  { background: #0f172a; color: #64748b;  border: 1px solid #1e293b; }
    .pill-blue  { background: #0a1628; color: #60a5fa;  border: 1px solid #1e3a5f; }
    .pill-green { background: #052e16; color: #4ade80;  border: 1px solid #14532d; }
    .pill-amber { background: #1c0e00; color: #fbbf24;  border: 1px solid #78350f; }
    .pill-red   { background: #1f0a0a; color: #f87171;  border: 1px solid #7f1d1d; }

    .card-btns { display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; align-self: center; }
    .btn-sm {
      font-size: 12px; font-weight: 500; color: #475569;
      text-decoration: none; padding: 5px 10px;
      border: 1px solid #1e293b; border-radius: 6px; background: #0f172a;
      transition: color .15s, border-color .15s; white-space: nowrap;
      text-align: center; cursor: pointer;
    }
    .btn-sm:hover { color: #94a3b8; border-color: #334155; }

    .modal {
      position: fixed; inset: 0; z-index: 1000;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal.hidden { display: none; }
    .modal-bd { position: absolute; inset: 0; background: rgba(0,0,0,.8); backdrop-filter: blur(4px); }
    .modal-win {
      position: relative; z-index: 1;
      width: 100%; max-width: 960px; height: 90vh;
      background: #0f1117; border: 1px solid #334155;
      border-radius: 12px; display: flex; flex-direction: column; overflow: hidden;
    }
    .modal-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; background: #1a1f2e; border-bottom: 1px solid #1e293b;
    }
    .modal-title { flex: 1; font-size: 13px; font-weight: 500; color: #cbd5e1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-newtab {
      font-size: 12px; font-weight: 500; color: #94a3b8; text-decoration: none;
      padding: 4px 10px; border: 1px solid #334155; border-radius: 6px;
      background: #0f172a; flex-shrink: 0; transition: color .15s, border-color .15s;
    }
    .btn-newtab:hover { color: #f1f5f9; border-color: #64748b; }
    .modal-close {
      background: none; border: none; color: #64748b; font-size: 20px;
      cursor: pointer; padding: 2px 6px; border-radius: 4px;
      transition: color .15s, background .15s; line-height: 1;
    }
    .modal-close:hover { color: #f1f5f9; background: #1e293b; }
    .modal-frame { flex: 1; width: 100%; border: none; background: #fff; }

    .empty { max-width: 860px; margin: 80px auto; text-align: center; color: #334155; font-size: 14px; }

    .scroll-top {
      position: fixed; bottom: 28px; right: 28px;
      width: 42px; height: 42px; border-radius: 50%;
      background: #1e293b; border: 1px solid #334155;
      color: #94a3b8; font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .2s, background .15s;
    }
    .scroll-top.visible { opacity: 1; pointer-events: auto; }
    .scroll-top:hover { background: #334155; color: #f1f5f9; }
  </style>
</head>
<body>

<div id="modal" class="modal hidden">
  <div class="modal-bd" onclick="closeModal()"></div>
  <div class="modal-win">
    <div class="modal-bar">
      <span class="modal-title" id="modal-title"></span>
      <a id="modal-newtab" href="#" target="_blank" class="btn-newtab" onclick="event.stopPropagation()">↗ Neuer Tab</a>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <iframe id="modal-frame" class="modal-frame" src=""></iframe>
  </div>
</div>

<header>
  <a href="/">← Outlook Spam-Bewerter</a>
  <a href="index.html" style="margin-left:16px;">← Statischer Index</a>
  <h1>Delivery Reports — Datenbank</h1>
  <p>Automatisch gespeicherte Reports, Anschreiben &amp; Aktionspläne aus dem Add-in.</p>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="Domain, Betreff, ESP suchen…" oninput="filterCards()">
  <select id="filter-type" onchange="filterCards()">
    <option value="">Alle Typen</option>
    <option value="report">Report</option>
    <option value="anschreiben">Anschreiben</option>
    <option value="aktionsplan">Aktionsplan</option>
  </select>
  <span class="count" id="count"></span>
</div>

<div class="report-grid" id="grid">
  <div class="empty" id="loading">Lade Reports…</div>
</div>

<button class="scroll-top" id="scrollTop"
        onclick="window.scrollTo({top:0,behavior:'smooth'})"
        aria-label="Nach oben">↑</button>

<script>
const WORKER_URL = 'https://spam-scorer-ai.felber.workers.dev';
let allReports = [];

async function loadReports() {
  try {
    const res  = await fetch(WORKER_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: 'list' }),
    });
    const data = await res.json();
    allReports = data.reports || [];
    renderCards(allReports);
  } catch (err) {
    document.getElementById('grid').innerHTML =
      `<div class="empty">Fehler beim Laden: ${err.message}</div>`;
  }
}

function renderCards(reports) {
  const grid = document.getElementById('grid');
  document.getElementById('count').textContent = `${reports.length} Einträge`;

  if (!reports.length) {
    grid.innerHTML = '<div class="empty">Noch keine gespeicherten Einträge.</div>';
    return;
  }

  grid.innerHTML = reports.map(r => {
    const score    = r.addin_score ?? '–';
    const aiScore  = r.ai_score    ?? '–';
    const scorePill = r.addin_score >= 7 ? 'pill-red'
                    : r.addin_score >= 4 ? 'pill-amber'
                    : 'pill-green';
    const typePill = r.type === 'report'      ? 'pill-gray'
                   : r.type === 'anschreiben' ? 'pill-blue'
                   : 'pill-amber';
    const typeLabel = r.type === 'report' ? 'Report' : r.type === 'anschreiben' ? 'Anschreiben' : 'Aktionsplan';
    const date = r.created_at ? r.created_at.slice(0, 10) : '–';
    const title = r.subject ? `${r.domain} — ${r.subject}` : r.domain;

    return `<div class="report-card" onclick="openReport(${r.id},'${escAttr(title)}')">
      <div class="card-left">
        <div class="card-title">${esc(title)}</div>
        <div class="card-meta">${date} · ${esc(r.sender || r.domain)}${r.esp ? ' · ' + esc(r.esp) : ''}</div>
        <div class="pills">
          <span class="pill ${typePill}">${typeLabel}</span>
          ${r.type === 'report' ? `<span class="pill ${scorePill}">Add-in ${score}/10</span><span class="pill pill-gray">AI ${aiScore}/10</span>` : ''}
        </div>
      </div>
      <div class="card-btns">
        <button class="btn-sm" onclick="event.stopPropagation();openReport(${r.id},'${escAttr(title)}')">Öffnen</button>
      </div>
    </div>`;
  }).join('');
}

function filterCards() {
  const q    = document.getElementById('search').value.toLowerCase();
  const type = document.getElementById('filter-type').value;
  const filtered = allReports.filter(r => {
    const matchType = !type || r.type === type;
    const matchQ    = !q || [r.domain, r.sender, r.subject, r.esp].some(v => v?.toLowerCase().includes(q));
    return matchType && matchQ;
  });
  renderCards(filtered);
}

function openReport(id, title) {
  const url = WORKER_URL;
  document.getElementById('modal-title').textContent  = title;
  document.getElementById('modal-newtab').href = '#';
  document.getElementById('modal-newtab').onclick = async (e) => {
    e.preventDefault();
    const html = await fetchReportHtml(id);
    const blob = new Blob([html], { type: 'text/html' });
    window.open(URL.createObjectURL(blob), '_blank');
  };
  loadReportIntoFrame(id, title);
  document.getElementById('modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

async function loadReportIntoFrame(id, title) {
  const html = await fetchReportHtml(id);
  const blob = new Blob([html], { type: 'text/html; charset=utf-8' });
  const blobUrl = URL.createObjectURL(blob);
  const frame = document.getElementById('modal-frame');
  frame.src = blobUrl;
}

async function fetchReportHtml(id) {
  const res = await fetch(WORKER_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ mode: 'get', id }),
  });
  return await res.text();
}

function closeModal() {
  document.getElementById('modal').classList.add('hidden');
  document.getElementById('modal-frame').src = '';
  document.body.style.overflow = '';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

window.addEventListener('scroll', () => {
  document.getElementById('scrollTop')?.classList.toggle('visible', window.scrollY > 300);
}, { passive: true });

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s ?? '').replace(/'/g, "\\'").replace(/"/g, '\\"');
}

loadReports();
</script>
</body>
</html>
